###############################################################################
# VICIdial - Docker Compose (convive con FreePBX en el host)
###############################################################################

networks:
  vicinet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.26.0.0/16
          gateway: 172.26.0.1

volumes:
  mysql_data:
  vicidial_recordings:
  asterisk_logs:

services:
  # ─── Base de datos ──────────────────────────────────────────────────────────
  db:
    image: mariadb:10.11
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./config/mariadb/my.cnf:/etc/mysql/my.cnf:ro
      - ./config/mariadb/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      vicinet:
        ipv4_address: 172.26.0.10

  # ─── VICIdial (Asterisk 20 + Web + App) ────────────────────────────────────
  vicidial:
    build: ./source
    image: vicidial-local:latest
    restart: unless-stopped
    privileged: true
    environment:
      TZ: ${TZ:-UTC}
      SERVER_IP: ${SERVER_IP}
      VICIDIAL_DB_HOST: db
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_CUSTOM_USER: ${MYSQL_CUSTOM_USER}
      MYSQL_CUSTOM_PASSWORD: ${MYSQL_CUSTOM_PASSWORD}
    ports:
      - "8082:80/tcp"
      - "8443:443/tcp"
      - "5062:5060/udp"
      - "5062:5060/tcp"
      - "12000-12100:10000-10100/udp"
    volumes:
      - vicidial_recordings:/var/spool/asterisk/monitorDONE
      - asterisk_logs:/var/log/asterisk
    networks:
      vicinet:
        ipv4_address: 172.26.0.20
    depends_on:
      db:
        condition: service_healthy
